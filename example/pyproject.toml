[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aipixel"
version = "1.0.20261005"
description = "AIP pixel art converter toolkit"
requires-python = ">=3.9"
dependencies = ["Pillow"]

[tool.setuptools]
py-modules = [
    "aip_converter",
    "img2aip_converter",
    "img2x_converter",
    "process_attack",
    "process_knight",
]
