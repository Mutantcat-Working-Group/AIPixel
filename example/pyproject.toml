[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aipixel"
# 版本号跟着桌面端一起走。这里是 example 里的遗留转换脚本，发版流水线
# 照样会给它打轮子，所以忘升这一行，release 里就会躺着一个上一版的包。
version = "1.0.20261018"
description = "AIP pixel art converter toolkit"
requires-python = ">=3.9"
dependencies = ["Pillow"]
license = { text = "GPL-3.0-only" }

[tool.setuptools]
py-modules = [
    "aip_converter",
    "img2aip_converter",
    "img2x_converter",
    "process_attack",
    "process_knight",
]
