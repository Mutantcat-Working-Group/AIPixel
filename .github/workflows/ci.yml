name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Byte-compile sources
        run: python -m compileall -q aip_converter.py img2aip_converter.py img2x_converter.py process_attack.py process_knight.py
      - name: Smoke test AIP conversion
        run: |
          python - <<'PY'
          import pathlib
          import tempfile
          from aip_converter import create_pixel_image, parse_aip_file

          out_dir = tempfile.mkdtemp()
          aip_data = parse_aip_file("input/heart.aip")
          output = create_pixel_image(aip_data, out_dir)
          assert pathlib.Path(output).exists()
          print("converted:", output)
          PY

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 工作区含 src-tauri，Tauri 的 build script 要拿 pkg-config 去找 glib/webkit，
      # 纯净的 runner 上一个都没有，不先装好就死在 glib-sys 上。
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config patchelf \
            libglib2.0-dev libgio-2.0-dev \
            libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev \
            libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # agent-core 是纯 Rust、不依赖 Tauri，这一层覆盖全部业务单测与集成测试
      - name: Run workspace tests
        run: cargo test --workspace
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # 与本地开发保持一致：仓库的 pnpm-workspace.yaml 用的是 12 代的
          # allowBuilds 白名单，9 代会把这个文件当成坏了的工作区直接报
          # 「packages field missing or empty」，连 store path 都问不出来。
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
