name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Byte-compile sources
        run: python -m compileall -q aip_converter.py img2aip_converter.py img2x_converter.py process_attack.py process_knight.py
      - name: Smoke test AIP conversion
        run: |
          python - <<'PY'
          import pathlib
          import tempfile
          from aip_converter import create_pixel_image, parse_aip_file

          out_dir = tempfile.mkdtemp()
          aip_data = parse_aip_file("input/heart.aip")
          output = create_pixel_image(aip_data, out_dir)
          assert pathlib.Path(output).exists()
          print("converted:", output)
          PY

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # agent-core 是纯 Rust、不依赖 Tauri，这一层覆盖全部业务单测与集成测试
      - name: Run workspace tests
        run: cargo test --workspace
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
