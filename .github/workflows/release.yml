name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Python packages
        run: |
          python -m pip install --upgrade pip build
          mkdir -p release
          (cd example && python -m build --outdir dist)
          cp example/dist/*.whl example/dist/*.tar.gz release/

      - name: Build source tar
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # 先把包写在被打包的目录外：写进 release/ 的话 tar 一边读一边发现
          # 自己在长，报「file changed as we read it」就整个 job 挂掉，刚拷
          # 进来的 wheel 也会跟着被打进源码包。所以排除 release/，压完再挪回去。
          tar -czf "/tmp/aipixel-${VERSION}-source.tar.gz" \
            --exclude='./.git' \
            --exclude='./.venv' \
            --exclude='./__pycache__' \
            --exclude='./build' \
            --exclude='./aipixel.egg-info' \
            --exclude='./dist' \
            --exclude='./example/build' \
            --exclude='./example/dist' \
            --exclude='./example/__pycache__' \
            --exclude='./example/aipixel.egg-info' \
            --exclude='./release' \
            -C . .
          mv "/tmp/aipixel-${VERSION}-source.tar.gz" "release/"
          cd release
          sha256sum * > ../checksums.txt
          md5sum * > ../checksums-md5.txt
          sha1sum * > ../checksums-sha1.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aipixel
          path: |
            release/*
            checksums.txt
            checksums-md5.txt
            checksums-sha1.txt

  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release-assets/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${TAG}" release-assets/* --repo "${GITHUB_REPOSITORY}" --title "${TAG}" --generate-notes
          fi
