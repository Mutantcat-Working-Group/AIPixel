name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  python:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Python packages
        run: |
          python -m pip install --upgrade pip build
          mkdir -p release
          (cd example && python -m build --outdir dist)
          cp -- example/dist/*.whl example/dist/*.tar.gz release/

      - name: Build source tar
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # 先把包写在被打包的目录外：写进 release/ 的话 tar 一边读一边发现
          # 自己在长，报「file changed as we read it」就整个 job 挂掉，刚拷
          # 进来的 wheel 也会跟着被打进源码包。所以排除 release/，压完再挪回去。
          tar -czf "/tmp/aipixel-${VERSION}-source.tar.gz" \
            --exclude='./.git' \
            --exclude='./.venv' \
            --exclude='./__pycache__' \
            --exclude='./build' \
            --exclude='./aipixel.egg-info' \
            --exclude='./dist' \
            --exclude='./example/build' \
            --exclude='./example/dist' \
            --exclude='./example/__pycache__' \
            --exclude='./example/aipixel.egg-info' \
            --exclude='./release' \
            -C . .
          mv "/tmp/aipixel-${VERSION}-source.tar.gz" "release/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python
          # 只传包本身：校验值放到 publish 阶段算。在 python job 里算的话，
          # 那时候桌面安装包还没编出来，checksums 里只会躺着 python 那两三个文件，
          # 用户下载的 dmg/exe/deb 反而没有校验值可对。
          path: |
            release/*

  # 桌面安装包全部由 CI 出：mac 出 x64/arm64 dmg，win 出 x64/arm64 NSIS，
  # linux 出 x64/arm64 AppImage + deb。签名、语言、管理员权限都写在 tauri.conf.json
  # 和自定义 NSIS 模板里，CI 只是照配置编，不额外传参。
  desktop:
    name: desktop ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 与 ci.yml 的 rust job 同一份依赖清单：纯净 runner 上不装就死在 glib-sys
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config patchelf \
            libglib2.0-dev \
            libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev \
            libxdo-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Hosted runner 上没有代码签名证书，现场签一张自签名的，不然 Windows 只能
      # 出无签名安装包。签名材料和 signtool 路径写进 GITHUB_ENV 给后面用。
      - name: Mint a self-signed code-signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'aipixel-code-signing.pfx'
          $password = 'mutantcat'
          $cert = New-SelfSignedCertificate `
            -Subject 'CN=Mutantcat Working Group, O=Mutantcat Working Group, C=CN' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -KeyUsage DigitalSignature `
            -Type CodeSigningCert `
            -KeyExportPolicy Exportable `
            -KeyLength 2048 `
            -HashAlgorithm SHA256 `
            -NotAfter (Get-Date).AddYears(10)
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString -String $password -Force -AsPlainText) | Out-Null
          "PFX_PATH=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SIGN_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $signtool = $null
          foreach ($kit in (Get-ChildItem -Path 'C:\Program Files (x86)\Windows Kits\10\bin' -Directory | Sort-Object Name -Descending)) {
            $candidate = Join-Path $kit.FullName 'x64\signtool.exe'
            if (Test-Path $candidate) { $signtool = $candidate; break }
          }
          if (-not $signtool) { throw 'signtool.exe not found in the Windows SDK' }
          "SIGNTOOL_PATH=$signtool" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # bundler 只会原样打包编出来的 exe：Windows 上先编不打包、把 exe 签掉，
      # 再让 bundler 打 NSIS，不然安装包里嵌的是没签名的本体。
      - name: Build and self-sign the Windows payload
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm tauri build --no-bundle
          $exes = @()
          foreach ($root in @('target/release', 'src-tauri/target/release')) {
            if (Test-Path -LiteralPath $root) {
              $exes += @(Get-ChildItem -Path $root -Filter *.exe -File)
            }
          }
          if ($exes.Count -eq 0) { throw 'no release executable to sign under target/release' }
          & $env:SIGNTOOL_PATH sign /fd SHA256 /f $env:PFX_PATH /p $env:SIGN_PASSWORD /d 'AIPixel' $exes.FullName

      - name: Build installers
        env:
          # 没有苹果开发者证书，走 ad-hoc 签名；Gatekeeper 会提示用户右键打开
          APPLE_SIGNING_IDENTITY: "-"
          # appimagetool 自身是个 AppImage，缺 libfuse 的 runner 上靠这个跑起来
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          pnpm tauri build --target ${{ matrix.target }}

      # bundle 的落点会随 --target 在 target/release 与 target/<triple>/release
      # 之间漂，而且 cargo workspace 的 target 落在仓库根、不在 src-tauri 下，
      # 所以按后缀从两个位置扫，把安装包捞出来摊到一层，顺带把 bundle/macos
      # 里的 .app 这类中间产物挡在 artifact 外头。
      - name: Collect installers
        run: |
          mkdir -p installer-out
          for d in target src-tauri/target; do
            [ -d "$d" ] || continue
            find "$d" -type f -path '*/bundle/*' \
              \( -name '*.dmg' -o -name '*-setup.exe' -o -name '*.AppImage' -o -name '*.deb' \) \
              -exec cp -n {} installer-out/ \;
          done
          ls -l installer-out
          [ -n "$(ls -A installer-out)" ]

      # 自签证书不在信任链里，所以不断签名链，只确认签名确实落在刚签的那张证书上。
      - name: Sign and verify the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setups = @(Get-ChildItem -Path 'installer-out' -Filter '*-setup.exe' -File)
          if ($setups.Count -eq 0) { throw 'no Windows installer collected to sign' }
          foreach ($setup in $setups) {
            & $env:SIGNTOOL_PATH sign /fd SHA256 /f $env:PFX_PATH /p $env:SIGN_PASSWORD /d 'AIPixel Installer' $setup.FullName
            $signature = Get-AuthenticodeSignature -FilePath $setup.FullName
            if ($signature.Status -eq 'NotSigned') { throw "installer $($setup.Name) carries no signature" }
            if ($signature.SignerCertificate.Thumbprint -ne $env:CERT_THUMBPRINT) {
              throw "installer $($setup.Name) was signed by an unexpected certificate"
            }
            Write-Host "installer signed: $($setup.Name) -> $($signature.SignerCertificate.Subject)"
          }

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: installer-out/*
          if-no-files-found: error

      # 用户挂载的是 DMG 本体，ad-hoc 签名和 /Applications 快捷方式得在镜像里活着。
      # 放在上传之后：万一这一步判不活，安装包也已经进了 artifact，publish 照样拿得到。
      - name: Verify the macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          images=(installer-out/*.dmg)
          if [ "${#images[@]}" -eq 0 ]; then
            echo "::error::no disk image to verify"
            exit 1
          fi
          image="${images[0]}"

          # 结构校验不挂载也能做：镜像本体烂没烂，读一遍资源表就知道。
          if hdiutil udifderez -xml "${image}" >/dev/null 2>&1; then
            echo "disk image is structurally valid: ${image}"
          else
            echo "::error::${image} is not a readable UDIF disk image"
            exit 1
          fi

          # 镜像本体不验：tauri 的 bundler 只给里面的 .app 签名，DMG 镜像是裸的，
          # codesign --verify 打在镜像上必然报 "code object is not signed at all"。
          # 要验的是镜像里的 app 和 /Applications 快捷方式，往下找取内容的路子。
          ROOT=""
          MOUNT="$(mktemp -d)"
          MOUNTED_DEV=""
          cleanup() {
            if [ -n "${MOUNTED_DEV}" ]; then
              sudo diskutil unmount "${MOUNT}" >/dev/null 2>&1 || true
              hdiutil detach "${MOUNTED_DEV}" >/dev/null 2>&1 || true
            else
              # 走的是不挂载的路子时这里根本没东西可卸，hdiutil 会返回非零，
              # 而 set -e 下那会让整个脚本以 1 收场——校验明明过了却算失败。
              hdiutil detach "${MOUNT}" >/dev/null 2>&1 || true
            fi
            return 0
          }
          trap cleanup EXIT

          # 路线一：让 hdiutil 连挂带载，最快。新一点的 macOS runner 起不来磁盘仲裁，
          # 这条路会直接 "attach canceled"，所以重试两轮就换别的路子。
          try_hdiutil_mount() {
            local i
            for i in 1 2; do
              if hdiutil attach "${image}" -nobrowse -readonly -mountpoint "${MOUNT}"; then
                ROOT="${MOUNT}"
                return 0
              fi
              echo "hdiutil attach -mountpoint 第 ${i} 次未成，2 秒后重试"
              sleep 2
            done
            return 1
          }

          # 路线二：只 attach 裸设备（不走磁盘仲裁），再用 mount 手工挂文件系统。
          try_manual_mount() {
            local out dev fs
            out="$(hdiutil attach "${image}" -nomount -nobrowse -noverify -noautofsck 2>/dev/null)" || return 1
            dev="$(printf '%s\n' "${out}" | awk '/Apple_(HFS|APFS)/ {print $1; exit}')"
            if [ -z "${dev}" ]; then
              echo "no HFS/APFS partition inside ${image}"
              return 1
            fi
            echo "raw device ${dev} attached without mounting"
            for fs in hfs apfs; do
              if sudo mount -t "${fs}" -o ro "${dev}" "${MOUNT}" 2>/dev/null; then
                MOUNTED_DEV="${dev}"
                ROOT="${MOUNT}"
                echo "mounted ${dev} as ${fs} at ${MOUNT}"
                return 0
              fi
            done
            hdiutil detach "${dev}" >/dev/null 2>&1 || true
            return 1
          }

          # 路线三：连挂载都不做，用 7z 把镜像里的文件取出来看。磁盘仲裁整个不顶用时，
          # 这条照样能验，最稳，代价是要装个 p7zip。
          try_extract_with_7z() {
            if ! command -v 7z >/dev/null 2>&1; then
              echo "installing p7zip for mount-free verification"
              if ! brew install p7zip >/dev/null 2>&1; then
                echo "could not install p7zip"
                return 1
              fi
            fi
            if ! 7z x "${image}" -o"${MOUNT}" >/dev/null; then
              echo "7z could not read ${image}"
              return 1
            fi
            # 解出来多套一层卷名，别的路子根就是镜像根，这里往下钻一层对齐。
            local volume
            volume="$(find "${MOUNT}" -mindepth 1 -maxdepth 1 -type d | head -1)"
            if [ -z "${volume}" ]; then
              echo "no volume directory inside ${image}"
              return 1
            fi
            ROOT="${volume}"
            echo "extracted ${image} to ${ROOT}"
            return 0
          }

          if ! try_hdiutil_mount; then
            if ! try_manual_mount; then
              if ! try_extract_with_7z; then
                # 三条路子都没成，多半是 runner 侧取不出镜像内容。结构校验已经过了，
                # 安装包也上传了，告警收尾，不拿它把整轮发版卡死。
                echo "::warning::没能读出 ${image} 里的内容，跳过内容校验（结构校验已通过）"
                exit 0
              fi
            fi
          fi

          if [ -L "${ROOT}/Applications" ]; then
            link_target="$(readlink "${ROOT}/Applications")"
          elif [ -f "${ROOT}/Applications" ]; then
            # 解压工具把软链接还原成了内容是指向的普通文件。
            link_target="$(tr -d '\n' < "${ROOT}/Applications")"
          elif [ -d "${ROOT}/Applications" ]; then
            link_target=""
          else
            echo "::error::${image} has no /Applications shortcut"
            exit 1
          fi
          if [ -n "${link_target}" ]; then
            echo "/Applications shortcut -> ${link_target}"
            if [ "${link_target}" != "/Applications" ]; then
              echo "::error::the /Applications shortcut points at ${link_target}"
              exit 1
            fi
          else
            echo "::warning::extractor did not materialize the /Applications shortcut"
          fi

          bundles=("${ROOT}"/*.app)
          if [ "${#bundles[@]}" -ne 1 ]; then
            echo "::error::expected one .app bundle in ${image}, found ${#bundles[@]}"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "${bundles[0]}"
          # 走管道判 grep -q 会被 pipefail 反咬：grep 一匹配就退，codesign 收到
          # SIGPIPE，整条管道的状态就成了 141，明明签对了也判失败。先收进变量再比。
          sig="$(codesign -dv "${bundles[0]}" 2>&1)" || true
          case "${sig}" in
            *"Signature=adhoc"*)
              echo "bundle is ad-hoc signed: ${bundles[0]}"
              ;;
            *)
              echo "::error::the .app inside ${image} is not ad-hoc signed"
              exit 1
              ;;
          esac


  publish:
    needs: [python, desktop]
    runs-on: ubuntu-22.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      # 全部资产都到齐了才算校验值：六个桌面安装包、两个 python 包、源码包，
      # 一个都不少地写进 checksums*.txt，再跟资产一起上传。
      - name: Compute release checksums
        run: |
          cd release-assets
          sha256sum -- * > ../checksums.txt
          md5sum -- * > ../checksums-md5.txt
          sha1sum -- * > ../checksums-sha1.txt
          mv ../checksums*.txt .

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # python 那边传进来的是「release/ 下的包 + 仓库根目录的 checksums」，
          # download-artifact 会照原样还原这层目录，glob 展开后 release/ 本身
          # 也排在列表里，gh 就把它当资产上传并报「is a directory」。先把子目录
          # 里的文件提到最上一层，再删掉空目录，保证传上去的全是文件。
          find release-assets -mindepth 2 -type f -exec mv -n {} release-assets/ \;
          find release-assets -mindepth 1 -type d -empty -delete
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release-assets/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${TAG}" release-assets/* --repo "${GITHUB_REPOSITORY}" --title "${TAG}" --generate-notes
          fi
