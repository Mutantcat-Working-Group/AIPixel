[workspace]
members = ["crates/pixel-core", "crates/agent-core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "1.0.20261007"
edition = "2021"
license = "GPL-3.0"
repository = "https://github.com/Mutantcat-Working-Group/AIPixel"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
