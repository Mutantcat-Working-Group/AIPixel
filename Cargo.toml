[workspace]
members = ["crates/pixel-core", "crates/agent-core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "1.0.20261017"
edition = "2021"
license = "GPL-3.0"
repository = "https://github.com/Mutantcat-Working-Group/AIPixel"
homepage = "https://www.mutantcat.org/"
# 发行商：异猫工作群（Mutantcat Working Group）。Cargo 的 authors 不支持 URL 形式，官方站点见 homepage。
authors = ["Mutantcat Working Group"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# net / io-util：MCP 服务端自己听 127.0.0.1 的 socket 说 HTTP，
# 不额外拉 hyper / axum 这类整框架进来。
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
